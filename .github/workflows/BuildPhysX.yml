name: Build PhysX

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# Creating the release needs a writable token. Org-default workflow
# permissions are read-only, which surfaced as a bare `403` from
# action-gh-release after a successful build.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.config }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        config: [debug, release, profile, checked]

    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          # Only a v-prefixed tag names a real version. Anything else — main, or
          # a branch used for a workflow_dispatch test run — must fall back to
          # the dev version: a ref like `fix/linux-gpu-build` would otherwise be
          # spliced into the archive name and its '/' would break `tar -czf`.
          case "$ref" in
            v[0-9]*) ;;
            *)       ref="v0.0.0-dev" ;;
          esac
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-Omniverse/PhysX
          ref: 107.3-physx-5.6.1

      # === WINDOWS ===
      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.5.0'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          log-file-suffix: '${{ matrix.os }}-${{ matrix.config }}.txt'

      - name: Download preset (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -L --fail -o vc17win64-gpu-md.xml https://raw.githubusercontent.com/LumiverseAI/PhysXBuild/main/vc17win64-gpu-md.xml
          cp vc17win64-gpu-md.xml ./physx/buildtools/presets/public/

      - name: Generate Projects (Windows)
        if: runner.os == 'Windows'
        run: ./generate_projects.bat vc17win64-gpu-md
        working-directory: physx

      - name: Patch CUDA arches + nvcc threading (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: physx
        run: |
          # The 16 GB GitHub Windows runner cannot fit the full PhysX arch matrix:
          # PhysX 5.6 emits --generate-code for sm_75/80/86/89/90 (and 5.6.1 adds
          # Blackwell sm_100) plus `-t0`, which spawns one ptxas per arch in parallel
          # and crashes ptxas with ACCESS_VIOLATION (memory exhaustion). On top of
          # that, sm_100 (compute_100) is not even supported by the CUDA 12.5 toolkit
          # pinned above ("nvcc fatal: Unsupported gpu architecture 'compute_100'").
          # PX_GENERATE_GPU_REDUCED_ARCHITECTURES only drops sm_70, not enough.
          #
          # Strategy: keep sm_75 only and rely on PTX JIT to cover Ampere/Ada/Hopper/
          # Blackwell at first launch, then force nvcc to serialize ptxas per .cu (-t1).
          shopt -s globstar nullglob
          changed=0
          for f in compiler/vc17win64-gpu-md/**/*.vcxproj; do
            # Strip EVERY generate-code entry that is not sm_75: compute_80-99 and
            # compute_100+ (Blackwell/newer). compute_75 (7x) is left untouched.
            # NB: `#` delimiter avoids clashing with `|` alternation inside the
            # pattern (which `s|...|` would mis-parse as the end of the regex).
            sed -i -E 's# --generate-code=arch=compute_(8[0-9]|9[0-9]|1[0-9][0-9]),code=\[[^]]+\]##g' "$f"
            # Serialize ptxas threads per nvcc invocation.
            sed -i 's| -t0 | -t1 |g' "$f"
            changed=$((changed+1))
          done
          echo "Patched $changed .vcxproj file(s)."
          # Sanity check: a GPU project's nvcc command should now reference only sm_75.
          gpu_proj="$(ls compiler/vc17win64-gpu-md/sdk_gpu_source_bin/PhysXBroadphaseGpu.vcxproj 2>/dev/null || true)"
          if [ -n "$gpu_proj" ]; then
            echo "=== generate-code lines remaining in PhysXBroadphaseGpu.vcxproj ==="
            grep -oE -- '--generate-code=arch=compute_[0-9]+,code=\[[^]]+\]' "$gpu_proj" | sort -u
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # --parallel 2 caps msbuild to two .vcxproj at once; combined with -t1 this
        # keeps RAM usage well under 16 GB on the runner.
        run: cmake --build ./compiler/vc17win64-gpu-md --config ${{ matrix.config }} --parallel 2
        working-directory: physx

      - name: Package (Windows)
        if: runner.os == 'Windows'
        id: package-windows
        shell: bash
        env:
          PHYSX_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p output/bin output/lib output/include output/documentation
          binArchiveName="Physx-${PHYSX_VERSION}.win.x86_64.vc143.md.${{ matrix.config }}.zip"
          echo "PHYSX_BINARY_ARCHIVE=$binArchiveName" >> "$GITHUB_OUTPUT"
          cp physx/bin/win.x86_64.vc143.md/${{ matrix.config }}/*.dll output/bin/
          cp physx/bin/win.x86_64.vc143.md/${{ matrix.config }}/*.lib output/lib/
          cp -r physx/include/* output/include/
          cp -r physx/documentation/* output/documentation/ 2>/dev/null || true
          # PhysXDevice64.dll is a prebuilt redistributable in some PhysX SDK drops.
          # Search the whole physx/bin tree and copy if found (do not fail if absent).
          found_device="$(find physx/bin -type f -name 'PhysXDevice64.dll' -print -quit 2>/dev/null || true)"
          if [ -n "$found_device" ]; then
            cp "$found_device" output/bin/
          fi
          if [ -n "${CUDA_PATH:-}" ]; then
            cuda_bin="$(cygpath -u "$CUDA_PATH")/bin"
            cp "$cuda_bin"/cudart64_*.dll output/bin/ 2>/dev/null || true
          fi
          # PhysXGpu_64.dll is the GPU build's required artifact. Hard-fail if missing.
          test -f output/bin/PhysXGpu_64.dll
          echo "=== Contents of output/bin/ ==="
          ls -la output/bin/
          (cd output && 7z a "../$binArchiveName" ./bin/ ./lib/ ./include/ ./documentation/)

      # === LINUX ===
      # Mirrors the Windows branch: GPU-enabled, shared libraries, same
      # PVD runtime. Snippets stay off (they need OpenGL/X11, absent from the
      # headless runner) — they are samples and never ship in the artifact.
      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.5.0'
          method: network
          sub-packages: '["nvcc", "cudart"]'
          log-file-suffix: '${{ matrix.os }}-${{ matrix.config }}.txt'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ninja-build cmake clang python3

      - name: Download preset (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L --fail -o linux-clang-gpu.xml https://raw.githubusercontent.com/LumiverseAI/PhysXBuild/main/linux-clang-gpu.xml
          cp linux-clang-gpu.xml ./physx/buildtools/presets/public/

      - name: Generate Projects (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./generate_projects.sh
          ./generate_projects.sh linux-clang-gpu
        working-directory: physx

      - name: Patch CUDA arches (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: physx
        run: |
          # Same constraint as the Windows branch, same remedy. PhysX 5.6.1
          # emits --generate-code for sm_75/80/86/89/90 plus Blackwell sm_100,
          # and the CUDA 12.5 toolkit pinned above does not know compute_100:
          #   nvcc fatal : Unsupported gpu architecture 'compute_100'
          # PX_GENERATE_GPU_REDUCED_ARCHITECTURES only drops sm_70 — verified
          # insufficient on this runner. Keep sm_75 alone and rely on PTX JIT
          # to cover Ampere/Ada/Hopper/Blackwell at first launch.
          BUILD_DIR="compiler/linux-clang-gpu-${{ matrix.config }}"

          # Log the real flag spelling before touching anything: if the
          # substitution below ever stops matching, this is what tells us why.
          echo "=== arch flags before patching ==="
          grep -rhoE -- '-{1,2}gen[a-z-]*code=arch=compute_[0-9]+[^ ]*' "$BUILD_DIR" | sort -u || true

          # CMake writes the CUDA flags into flags.make, and repeats them in
          # build.make for some generators. One substitution covers every
          # spelling nvcc accepts (`--generate-code` / `-gencode`, and a code=
          # value written as [a,b], as sm_NN, or as an escaped-quote list):
          # deliberately do NOT model the quoting, just consume to the next
          # space. Matching the escaped quotes was tried first and silently
          # failed to match, which is how compute_100 would survive again.
          find "$BUILD_DIR" -type f \( -name 'flags.make' -o -name 'build.make' \) -print0 |
            xargs -0 sed -i -E \
              -e 's# -{1,2}gen[a-z-]*code=arch=compute_(8[0-9]|9[0-9]|1[0-9][0-9]),code=[^ ]*##g'

          echo "=== arch flags after patching ==="
          grep -rhoE -- '-{1,2}gen[a-z-]*code=arch=compute_[0-9]+[^ ]*' "$BUILD_DIR" | sort -u || true

          # Fail here with a readable message rather than 90 seconds later
          # inside nvcc, if the flags turned out to be spelled differently.
          if grep -rqE 'compute_1[0-9][0-9]' "$BUILD_DIR"; then
            echo "::error::compute_1xx survived the patch — the arch flags are not in an expected format. See the dump above."
            grep -rnE 'compute_1[0-9][0-9]' "$BUILD_DIR" | head -5
            exit 1
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        # --parallel 2 mirrors the Windows cap: combined with the single CUDA
        # arch left by the patch above it keeps ptxas RAM under the runner's 16 GB.
        run: cmake --build ./compiler/linux-clang-gpu-${{ matrix.config }} --parallel 2
        working-directory: physx

      - name: Package (Linux)
        if: runner.os == 'Linux'
        id: package-linux
        env:
          PHYSX_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output/bin output/lib output/include output/documentation
          binArchiveName="PhysX-${PHYSX_VERSION}.linux.x86_64.clang.${{ matrix.config }}.tar.gz"
          echo "PHYSX_BINARY_ARCHIVE=$binArchiveName" >> "$GITHUB_OUTPUT"

          # Locate the build output instead of hardcoding a path: the bin
          # directory name is derived from the platform/compiler by PhysX's own
          # cmake and has moved between SDK versions. A previous hardcoded glob
          # silently matched nothing and shipped a headers-only archive.
          echo "=== physx/bin tree ==="
          find physx/bin -maxdepth 3 -type d | sort

          mapfile -t _libs < <(find physx/bin -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.a' \) -print)
          if [ "${#_libs[@]}" -eq 0 ]; then
            echo "::error::No PhysX libraries found under physx/bin — the build produced nothing to package."
            exit 1
          fi
          for _l in "${_libs[@]}"; do
            case "$_l" in
              *.a) cp -P "$_l" output/lib/ ;;
              *)   cp -P "$_l" output/bin/ ;;
            esac
          done

          cp -r physx/include/* output/include/
          cp -r physx/documentation/* output/documentation/ 2>/dev/null || true

          # Ship the CUDA runtime next to the libraries, as the Windows branch does.
          if [ -n "${CUDA_PATH:-}" ] && [ -d "${CUDA_PATH}/lib64" ]; then
            cp -P "${CUDA_PATH}"/lib64/libcudart.so* output/bin/ 2>/dev/null || true
          fi

          # Hard gates, mirroring `test -f output/bin/PhysXGpu_64.dll` on Windows.
          # Without these a broken build publishes a green, empty release.
          test -f output/bin/libPhysX_64.so
          test -f output/bin/libPhysXGpu_64.so

          echo "=== Contents of output/bin/ ==="
          ls -la output/bin/
          echo "=== Contents of output/lib/ ==="
          ls -la output/lib/

          tar -czf "$binArchiveName" -C output .

      # === PUBLISH ===
      # Tags only: a workflow_dispatch run on a branch has no tag to release
      # against, and would fail here after a perfectly good build.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.package-windows.outputs.PHYSX_BINARY_ARCHIVE }}
            ${{ steps.package-linux.outputs.PHYSX_BINARY_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
